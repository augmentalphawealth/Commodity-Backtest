name: Gold Daily and Hourly Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1-5"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  gold-backtest:
    name: Download Gold Data and Run Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_gold_downloader.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_gold_downloader.txt

      - name: Restore hourly cache
        uses: actions/cache@v4
        with:
          path: data_usd/cache_hourly
          key: gold-hourly-${{ github.run_id }}
          restore-keys: |
            gold-hourly-

      - name: Download hourly gold data
        run: python gold_usd_hourly_downloader.py

      - name: Download daily gold data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import yfinance as yf

          output = Path("data_usd/gold_usd_1d.csv")
          output.parent.mkdir(exist_ok=True)

          raw = yf.download(
              "GC=F",
              start="2018-01-01",
              interval="1d",
              auto_adjust=False,
              progress=False,
              threads=False,
          )

          if raw.empty:
              raise SystemExit("Daily GC=F download returned no rows")

          if isinstance(raw.columns, pd.MultiIndex):
              raw.columns = [str(c[0]).lower() for c in raw.columns]
          else:
              raw.columns = [str(c).lower() for c in raw.columns]

          raw = raw.rename(columns={"adj close": "close"})
          raw.index = pd.to_datetime(raw.index, utc=True)
          raw = raw[[c for c in ["open", "high", "low", "close", "volume"] if c in raw.columns]]
          raw.to_csv(output, index_label="timestamp_utc")
          print(f"Saved {len(raw)} daily rows to {output}")
          PY

      - name: Verify downloaded data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          for filename, minimum in [
              ("data_usd/gold_usd_1h.csv", 250),
              ("data_usd/gold_usd_1d.csv", 1000),
          ]:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Missing {filename}")
              rows = len(pd.read_csv(path))
              print(filename, rows, "rows")
              if rows < minimum:
                  raise SystemExit(f"Too few rows in {filename}")
          PY

      - name: Run multi-timeframe analysis
        run: python gold_multi_timeframe_analysis.py

      - name: Verify analysis outputs
        run: |
          test -s gold_results/analysis_manifest.json
          test -s gold_results/gold_summary_all.csv
          test -s gold_results/gold_best_configurations.csv
          test -s gold_results/gold_events_all.csv

      - name: Upload data and results
        uses: actions/upload-artifact@v4
        with:
          name: gold-daily-hourly-results-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            data_usd/gold_usd_1d.csv
            data_usd/gold_usd_1h.csv
            data_usd/gold_usd_1h_manifest.json
            gold_results/analysis_manifest.json
            gold_results/gold_summary_all.csv
            gold_results/gold_best_configurations.csv
            gold_results/gold_events_all.csv
            gold_results/gold_events_1d.csv
            gold_results/gold_events_4h.csv
            gold_results/gold_events_1h.csv
