name: Update gold data
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
      - name: Commit updated data
        run: |
          git config user.name 'gold-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/gold_daily.csv data/gold_hourly.csv
          git diff --cached --quiet || git commit -m "chore: update Yahoo gold data"
          git push
