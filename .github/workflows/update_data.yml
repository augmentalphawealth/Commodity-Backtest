name: Update gold data

on:
  schedule:
    # Check every hour on weekdays.
    # The Python script decides whether Gold is actually trading.
    - cron: '5 * * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Gold market status
        id: market
        run: python scripts/check_gold_market.py

      - name: Update Gold market data
        if: steps.market.outputs.market_open == 'true'
        run: python scripts/update_data.py

      - name: Commit updated data
        if: steps.market.outputs.market_open == 'true'
        run: |
          git config user.name 'gold-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'

          git add data/gold_daily.csv data/gold_hourly.csv

          if git diff --cached --quiet; then
            echo "No new Gold market data to commit."
          else
            git commit -m "chore: update Yahoo gold data"
            git push
          fi

      - name: Gold market closed
        if: steps.market.outputs.market_open != 'true'
        run: echo "Gold market is closed. No data update required."
